name: "220 · Fast Redeploy"
# Fast image update without a full Terraform apply.
# Use this when you only need to roll out a new container image to
# one or more ECS services — no infrastructure changes.
# ~3 minutes vs ~10+ minutes for a full Terraform deploy.
# Prerequisite:
#   AWS infrastructure must already be deployed by workflow 210.
# Like the Azure version it bypasses Terraform and the release catalog: the
# new task-definition revision is registered here, so the next 210 plan will
# show the service's task definition drifting back to the Terraform-declared
# image. Follow with a real 210 release.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod
      cluster:
        description: ECS cluster name override (defaults to cna-<env>-<region_short>)
        required: false
        default: ""
        type: string
      api_image:
        description: API image reference (empty = leave unchanged)
        required: false
        default: ""
        type: string
      worker_image:
        description: Worker image reference (empty = leave unchanged)
        required: false
        default: ""
        type: string
      web_image:
        description: Web image reference (empty = leave unchanged)
        required: false
        default: ""
        type: string

env:
  # Image signing (core TODO.md T-703): the exact Sigstore identity the core's
  # 200-build-images signs with — from this repository variable only, never from
  # the manifest, the dispatch payload or an input — the issuer every GitHub
  # Actions signer shares, and the cosign release that verifies them (keep in
  # step with the core's COSIGN_VERSION).
  IMAGE_SIGNING_IDENTITY: ${{ vars.IMAGE_SIGNING_IDENTITY }}
  SIGSTORE_OIDC_ISSUER: https://token.actions.githubusercontent.com
  COSIGN_VERSION: v3.1.3

permissions:
  id-token: write
  contents: read

# Serialize redeploys per environment so two overlapping runs don't race to
# register task-definition revisions for the same service; don't cancel an
# in-flight rollout.
concurrency:
  group: fast-redeploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    steps:
      # Inputs reach the shell only through env (never expanded into the script).
      # Every image given must be a pinned reference of this appliance
      # (docker.io/<ns>/cna:<role>-sha-<7>@sha256:<digest>); floating tags are
      # refused, tag-only references are accepted with a warning.
      - name: Validate — at least one image must be specified
        env:
          INPUT_API_IMAGE: ${{ inputs.api_image }}
          INPUT_WORKER_IMAGE: ${{ inputs.worker_image }}
          INPUT_WEB_IMAGE: ${{ inputs.web_image }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
        run: |
          set -euo pipefail
          if [ -z "$INPUT_API_IMAGE" ] && \
             [ -z "$INPUT_WORKER_IMAGE" ] && \
             [ -z "$INPUT_WEB_IMAGE" ]; then
            echo "::error::At least one image (api_image, worker_image, or web_image) must be specified."
            exit 1
          fi
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

          # Shared across both appliances (T-701) — keep byte-identical.
          # Validates a container image reference for a role. NS is the Docker Hub
          # namespace ($DOCKERHUB_NAMESPACE). Refuses floating/empty; accepts a
          # digest-pinned reference; accepts (with a warning) a tag-only reference;
          # refuses anything else (wrong namespace, wrong role, extra characters).
          validate_image_ref() {
            local ROLE="$1" REF="$2"
            local NS="${DOCKERHUB_NAMESPACE}"
            local PINNED="^docker\.io/${NS}/cna:${ROLE}-sha-[0-9a-f]{7}@sha256:[0-9a-f]{64}$"
            local TAG_ONLY="^docker\.io/${NS}/cna:${ROLE}-sha-[0-9a-f]{7}$"
            local HOWTO="get a pinned reference from 230 (Image Update), the core's .deployment-catalog/latest-build.json (images.${ROLE} + digests.${ROLE}), or the update-available issue"
            if [ -z "$REF" ]; then
              echo "::error::${ROLE} image reference is empty (floating references are refused); ${HOWTO}."
              return 1
            fi
            if [[ "$REF" == *-latest || "$REF" == *:latest ]]; then
              echo "::error::${ROLE} image reference '${REF}' is a floating tag (refused); ${HOWTO}."
              return 1
            fi
            if [[ "$REF" =~ $PINNED ]]; then
              return 0
            fi
            if [[ "$REF" =~ $TAG_ONLY ]]; then
              echo "::warning::${ROLE} image reference '${REF}' is a tag-only reference; digest not pinned."
              return 0
            fi
            echo "::error::${ROLE} image reference '${REF}' is not a valid pinned reference; ${HOWTO}."
            return 1
          }

          [ -z "$INPUT_API_IMAGE" ]    || validate_image_ref api "$INPUT_API_IMAGE"
          [ -z "$INPUT_WORKER_IMAGE" ] || validate_image_ref worker "$INPUT_WORKER_IMAGE"
          [ -z "$INPUT_WEB_IMAGE" ]    || validate_image_ref web "$INPUT_WEB_IMAGE"

      # The checkout serves the signature verifier below (as in the Azure
      # version) and the ECS roll script under scripts/ci, which keeps the
      # three service steps one line each.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Shared across both appliances (T-703) — keep byte-identical. 220 bypasses
      # Terraform and the catalog but not the signature gate: every image it is
      # about to roll must carry the core's keyless signature and provenance
      # attestation (scripts/ci/verify_image_signature.sh, the same check 210
      # runs).
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Verify image signatures and provenance
        env:
          INPUT_API_IMAGE: ${{ inputs.api_image }}
          INPUT_WORKER_IMAGE: ${{ inputs.worker_image }}
          INPUT_WEB_IMAGE: ${{ inputs.web_image }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_NAMESPACE" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::DOCKERHUB_NAMESPACE and DOCKERHUB_TOKEN are required to read the image signatures from Docker Hub."
            exit 1
          fi
          echo "$DOCKERHUB_TOKEN" | docker login docker.io --username "$DOCKERHUB_NAMESPACE" --password-stdin
          [ -n "$INPUT_API_IMAGE" ]    && scripts/ci/verify_image_signature.sh api    "$INPUT_API_IMAGE"
          [ -n "$INPUT_WORKER_IMAGE" ] && scripts/ci/verify_image_signature.sh worker "$INPUT_WORKER_IMAGE"
          [ -n "$INPUT_WEB_IMAGE" ]    && scripts/ci/verify_image_signature.sh web    "$INPUT_WEB_IMAGE"
          true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Names are deterministic from the Terraform locals: cluster
      # <prefix>-cluster, services <prefix>-{api,worker,web}, containers
      # cna-{api,worker,web}, with prefix cna-<env>-<region_short>. The cluster
      # input overrides the derived name only — the service names follow it.
      - name: Derive ECS names from environment
        id: names
        env:
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_CLUSTER: ${{ inputs.cluster }}
          REGION_SHORT: ${{ vars.AWS_REGION_SHORT }}
        run: |
          if [ -z "$REGION_SHORT" ]; then
            echo "::error::AWS_REGION_SHORT repository variable is required (scripts/Initialize-CnaAwsGitHubSecrets.ps1 writes it)."
            exit 1
          fi
          PREFIX="cna-${INPUT_ENV}-${REGION_SHORT}"
          if [ -n "$INPUT_CLUSTER" ]; then
            CLUSTER="$INPUT_CLUSTER"
          else
            CLUSTER="${PREFIX}-cluster"
          fi
          echo "cluster=${CLUSTER}"              >> "$GITHUB_OUTPUT"
          echo "prefix=${PREFIX}"                >> "$GITHUB_OUTPUT"
          echo "api_service=${PREFIX}-api"       >> "$GITHUB_OUTPUT"
          echo "worker_service=${PREFIX}-worker" >> "$GITHUB_OUTPUT"
          echo "web_service=${PREFIX}-web"       >> "$GITHUB_OUTPUT"

      # `az containerapp update --image` becomes: read the service's current
      # task definition, swap the application container's image, register it as
      # a new revision (tagged so the deploy role's tag-scoped ecs:* covers the
      # service update), and point the service at it with a forced deployment.
      - name: Update cna-api image
        if: inputs.api_image != ''
        env:
          IMAGE: ${{ inputs.api_image }}
          CLUSTER: ${{ steps.names.outputs.cluster }}
          SERVICE: ${{ steps.names.outputs.api_service }}
          CONTAINER: cna-api
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ecs_update_image.sh"

      - name: Update cna-worker image
        if: inputs.worker_image != ''
        env:
          IMAGE: ${{ inputs.worker_image }}
          CLUSTER: ${{ steps.names.outputs.cluster }}
          SERVICE: ${{ steps.names.outputs.worker_service }}
          CONTAINER: cna-worker
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ecs_update_image.sh"

      - name: Update cna-web image
        if: inputs.web_image != ''
        env:
          IMAGE: ${{ inputs.web_image }}
          CLUSTER: ${{ steps.names.outputs.cluster }}
          SERVICE: ${{ steps.names.outputs.web_service }}
          CONTAINER: cna-web
        run: bash "$GITHUB_WORKSPACE/scripts/ci/ecs_update_image.sh"

      - name: Verify cna-web health after update
        if: inputs.web_image != ''
        env:
          CLUSTER: ${{ steps.names.outputs.cluster }}
          SERVICE: ${{ steps.names.outputs.web_service }}
          PREFIX: ${{ steps.names.outputs.prefix }}
        run: |
          echo "Waiting for $SERVICE to reach a steady state..."
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE" \
            || echo "::warning::$SERVICE did not stabilize within the waiter window."
          # The public entry point is the CloudFront distribution in front of
          # the ALB; find it by the ALB it fronts. No custom domain is assumed.
          ALB_DNS=$(aws elbv2 describe-load-balancers --names "${PREFIX}-alb" \
            --query 'LoadBalancers[0].DNSName' --output text 2>/dev/null || echo "")
          EDGE_HOST=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Origins.Items[?DomainName=='${ALB_DNS}']].DomainName | [0]" \
            --output text 2>/dev/null || echo "")
          if [ -z "$EDGE_HOST" ] || [ "$EDGE_HOST" = "None" ]; then
            echo "::warning::No CloudFront distribution found in front of $ALB_DNS; skipping the HTTP health probe."
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            "https://${EDGE_HOST}/api/health" || echo "000")
          echo "Health check status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::cna-web /api/health returned $STATUS — check the /ecs/${PREFIX}/web log group for errors."
          fi

      - name: Summary
        env:
          INPUT_API_IMAGE: ${{ inputs.api_image }}
          INPUT_WORKER_IMAGE: ${{ inputs.worker_image }}
          INPUT_WEB_IMAGE: ${{ inputs.web_image }}
          API_SERVICE: ${{ steps.names.outputs.api_service }}
          WORKER_SERVICE: ${{ steps.names.outputs.worker_service }}
          WEB_SERVICE: ${{ steps.names.outputs.web_service }}
        run: |
          echo "## Refresh Complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| ECS service | Image |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$INPUT_API_IMAGE" ]; then
            echo "| \`${API_SERVICE}\` | \`${INPUT_API_IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$INPUT_WORKER_IMAGE" ]; then
            echo "| \`${WORKER_SERVICE}\` | \`${INPUT_WORKER_IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$INPUT_WEB_IMAGE" ]; then
            echo "| \`${WEB_SERVICE}\` | \`${INPUT_WEB_IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Terraform and the release catalog were bypassed — follow with a real \`210 · Deploy\`." >> "$GITHUB_STEP_SUMMARY"
