name: "360 · Drift Detection · prod"
# No schedule — enable once prod is deployed.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# Serialize prod drift scans — a manual dispatch shouldn't overlap another
# in-flight scan against the same prod state.
concurrency:
  group: cna-prod
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}

jobs:
  drift-detection:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hub
    env:
      ENVIRONMENT: prod
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_REGION_SHORT: ${{ vars.AWS_REGION_SHORT }}
    outputs:
      # "missing-environment" when the state backend or the state itself is
      # gone; "check-failed" for any other failure. Read by report-failure.
      failure_kind: ${{ steps.init-platform.outputs.failure_kind }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false

      - name: Validate AWS target inputs
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_TARGET_ACCOUNT_ID }}
          CNA_AWS_TARGET_ACCOUNT_ID_DEV: ${{ vars.CNA_AWS_TARGET_ACCOUNT_ID_DEV }}
          CNA_AWS_TARGET_ACCOUNT_ID_PROD: ${{ vars.CNA_AWS_TARGET_ACCOUNT_ID_PROD }}
        run: |
          if [[ ! "$EXPECTED_ACCOUNT_ID" =~ ^[0-9]{12}$ || ! "$AWS_REGION" =~ ^[a-z0-9]+(-[a-z0-9]+)+-[0-9]+$ || ! "$AWS_REGION_SHORT" =~ ^[a-z0-9]{2,8}$ ]]; then
            echo "::error::AWS_TARGET_ACCOUNT_ID, AWS_REGION and AWS_REGION_SHORT must be configured with valid client deployment values."
            exit 1
          fi
          source "$GITHUB_WORKSPACE/scripts/ci/assert_distinct_aws_accounts.sh"
          assert_distinct_aws_accounts "$ENVIRONMENT" "$EXPECTED_ACCOUNT_ID" \
            "$CNA_AWS_TARGET_ACCOUNT_ID_DEV" "$CNA_AWS_TARGET_ACCOUNT_ID_PROD"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d  # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify target account
        env:
          EXPECTED_ACCOUNT_ID: ${{ vars.AWS_TARGET_ACCOUNT_ID }}
          ALB_CERTIFICATE_ARN: ${{ vars.CNA_ALB_CERTIFICATE_ARN }}
          CUSTOM_DOMAIN_NAME: ${{ vars.CNA_CUSTOM_DOMAIN_NAME }}
          CLOUDFRONT_CERTIFICATE_ARN: ${{ vars.CNA_CLOUDFRONT_CERTIFICATE_ARN }}
        run: |
          if [[ ! "$EXPECTED_ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error::AWS_TARGET_ACCOUNT_ID must be set to the exact 12-digit target account ID in hub."
            exit 1
          fi
          if [[ ! "$AWS_REGION" =~ ^[a-z0-9]+(-[a-z0-9]+)+-[0-9]+$ || ! "$AWS_REGION_SHORT" =~ ^[a-z0-9]{2,8}$ ]]; then
            echo "::error::AWS_REGION and AWS_REGION_SHORT are invalid for prod."
            exit 1
          fi
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          if [[ "$ACCOUNT_ID" != "$EXPECTED_ACCOUNT_ID" ]]; then
            echo "::error::Authenticated to account $ACCOUNT_ID, but AWS_TARGET_ACCOUNT_ID expects $EXPECTED_ACCOUNT_ID."
            exit 1
          fi
          if [[ ! "$ALB_CERTIFICATE_ARN" =~ ^arn:[a-z0-9-]+:acm:${AWS_REGION}:${ACCOUNT_ID}:certificate/[0-9a-f-]{36}$ ]]; then
            echo "::error::CNA_ALB_CERTIFICATE_ARN must be an ACM certificate in AWS_REGION and the verified target account."
            exit 1
          fi
          if [[ -n "$CUSTOM_DOMAIN_NAME" || -n "$CLOUDFRONT_CERTIFICATE_ARN" ]]; then
            if [[ -z "$CUSTOM_DOMAIN_NAME" || -z "$CLOUDFRONT_CERTIFICATE_ARN" || ! "$CUSTOM_DOMAIN_NAME" =~ ^([A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?\.)+[A-Za-z]{2,63}$ || ! "$CLOUDFRONT_CERTIFICATE_ARN" =~ ^arn:[a-z0-9-]+:acm:us-east-1:${ACCOUNT_ID}:certificate/[0-9a-f-]{36}$ ]]; then
              echo "::error::CNA_CUSTOM_DOMAIN_NAME and CNA_CLOUDFRONT_CERTIFICATE_ARN must be supplied together with a valid domain and us-east-1 certificate in the target account."
              exit 1
            fi
          fi

      - name: Resolve Terraform backend targets
        env:
          VAR_TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          VAR_TFSTATE_LOCK_TABLE: ${{ vars.TFSTATE_LOCK_TABLE }}
        run: |
          if [[ -z "$VAR_TFSTATE_BUCKET" || -z "$VAR_TFSTATE_LOCK_TABLE" || -z "$AWS_REGION" || -z "$AWS_REGION_SHORT" ]]; then
            echo "::error::TFSTATE_BUCKET, TFSTATE_LOCK_TABLE, AWS_REGION and AWS_REGION_SHORT repository variables are required."
            exit 1
          fi
          echo "TFSTATE_BUCKET=$VAR_TFSTATE_BUCKET" >> "$GITHUB_ENV"
          echo "TFSTATE_LOCK_TABLE=$VAR_TFSTATE_LOCK_TABLE" >> "$GITHUB_ENV"

      # ── Platform state drift ────────────────────────────────────────────────
      - name: Terraform init (platform)
        id: init-platform
        working-directory: infra/terraform/environments/prod/platform
        run: |
          # A drift check has three outcomes, not two: clean, drifted, and "the
          # environment does not exist". A missing state backend or an empty
          # state is the third, and it is reported as its own, louder failure
          # (failure_kind=missing-environment, read by report-failure) — never as
          # drift and never as an ordinary plan error (TODO.md T-110).
          INIT_LOG="$RUNNER_TEMP/init-platform.log"
          if ! terraform init \
            -backend-config="bucket=$TFSTATE_BUCKET" \
            -backend-config="dynamodb_table=$TFSTATE_LOCK_TABLE" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="key=prod/platform.tfstate" > "$INIT_LOG" 2>&1; then
            cat "$INIT_LOG"
            if grep -qE 'NoSuchBucket|ResourceNotFoundException|does not exist|NotFound' "$INIT_LOG"; then
              echo "failure_kind=missing-environment" >> "$GITHUB_OUTPUT"
              echo "::error::The prod Terraform state backend (bucket or lock table) does not exist — the environment has been deleted out of band or was never bootstrapped. This is not drift."
            else
              echo "failure_kind=check-failed" >> "$GITHUB_OUTPUT"
            fi
            exit 1
          fi
          cat "$INIT_LOG"
          if [ -z "$(terraform state list 2>/dev/null)" ]; then
            echo "failure_kind=missing-environment" >> "$GITHUB_OUTPUT"
            echo "::error::prod/platform state is empty — the environment has never been deployed or has been destroyed. This is not drift."
            exit 1
          fi
          echo "failure_kind=check-failed" >> "$GITHUB_OUTPUT"

      # The AWS platform root declares no ai_mode (no firewall egress rule to
      # open); region and short code are the only inputs it takes from CI.
      - name: Terraform drift plan (platform)
        working-directory: infra/terraform/environments/prod/platform
        run: |
          # -detailed-exitcode: 0 = clean, 2 = drift (warn), anything else = the
          # plan itself failed and must fail the job, never be read as "no drift".
          EXIT=0
          terraform plan -detailed-exitcode \
            -var="region=$AWS_REGION" \
            -var="region_short=$AWS_REGION_SHORT" \
            || EXIT=$?
          if [ "$EXIT" -eq 2 ]; then
            echo "::warning::Drift detected in prod/platform state."
          elif [ "$EXIT" -ne 0 ]; then
            echo "::error::terraform plan failed for prod/platform (exit $EXIT)."
            exit "$EXIT"
          fi

      # ── Workload state drift ────────────────────────────────────────────────
      - name: Terraform init (workload)
        working-directory: infra/terraform/environments/prod/workload
        run: |
          terraform init \
            -backend-config="bucket=$TFSTATE_BUCKET" \
            -backend-config="dynamodb_table=$TFSTATE_LOCK_TABLE" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="key=prod/workload.tfstate"

      # Secrets Manager and S3 are IAM-gated, not IP-firewalled, so there is no
      # runner allow-list window to open here (the Azure version's Key Vault and
      # storage-account steps) and none to remove at the end.
      - name: Terraform drift plan (workload)
        working-directory: infra/terraform/environments/prod/workload
        # Secrets passed via TF_VAR_* env so they never appear in the process
        # listing / logs (unlike -var= on the command line).
        env:
          TF_VAR_db_admin_password: ${{ secrets.CNA_POSTGRES_ADMIN_PASSWORD }}
          TF_VAR_entra_client_secret: ${{ secrets.CNA_ENTRA_CLIENT_SECRET }}
          TF_VAR_nextauth_secret: ${{ secrets.CNA_NEXTAUTH_SECRET }}
          TF_VAR_dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}
          TF_VAR_credential_encryption_key: ${{ secrets.CNA_CREDENTIAL_ENCRYPTION_KEY }}
          TF_VAR_github_token: ""
          TFSTATE_BUCKET: ${{ vars.TFSTATE_BUCKET }}
          TFSTATE_LOCK_TABLE: ${{ vars.TFSTATE_LOCK_TABLE }}
          ALB_CERTIFICATE_ARN: ${{ vars.CNA_ALB_CERTIFICATE_ARN }}
          CUSTOM_DOMAIN_NAME: ${{ vars.CNA_CUSTOM_DOMAIN_NAME }}
          CLOUDFRONT_CERTIFICATE_ARN: ${{ vars.CNA_CLOUDFRONT_CERTIFICATE_ARN }}
          VAR_AI_ENGINE_DEFAULT: ${{ vars.CNA_AI_ENGINE_DEFAULT }}
          VAR_BYO_AI_PROVIDERS: ${{ vars.CNA_BYO_AI_PROVIDERS }}
          VAR_AZURE_MCP_ENDPOINT: ${{ vars.CNA_AZURE_MCP_ENDPOINT }}
          VAR_AZURE_MCP_TRANSPORT: ${{ vars.CNA_AZURE_MCP_TRANSPORT }}
          VAR_AWS_MCP_ENDPOINT: ${{ vars.CNA_AWS_MCP_ENDPOINT }}
          VAR_AWS_MCP_TRANSPORT: ${{ vars.CNA_AWS_MCP_TRANSPORT }}
          VAR_DRAWIO_MCP_URL: ${{ vars.CNA_DRAWIO_MCP_URL }}
          ENTRA_TENANT_ID: ${{ vars.CNA_ENTRA_TENANT_ID }}
          ENTRA_CLIENT_ID: ${{ vars.CNA_ENTRA_CLIENT_ID }}
          NEXTAUTH_URL: ${{ vars.CNA_NEXTAUTH_URL }}
          GITHUB_OWNER: ${{ github.repository_owner }}
          GITHUB_REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          if [ -z "$DOCKERHUB_NAMESPACE" ]; then
            echo "::error::DOCKERHUB_NAMESPACE variable is required."
            exit 1
          fi

          optional_var() {
            local VALUE="$1"
            if [[ -z "$VALUE" || "$VALUE" == "none" ]]; then
              echo ""
            else
              echo "$VALUE"
            fi
          }
          # Drift must be measured against what was actually deployed, not the
          # floating tags or the current repo variables: the release catalog
          # written by the deploy workflow is the source of truth for the image
          # references and the ai_mode this environment was applied with.
          CATALOG="$GITHUB_WORKSPACE/.deployment-catalog/prod/latest.json"
          catalog_value() {
            local KEY="$1" FALLBACK="$2"
            if [ -f "$CATALOG" ]; then
              local V
              V=$(jq -r "$KEY // empty" "$CATALOG")
              if [ -n "$V" ]; then echo "$V"; return; fi
            fi
            echo "$FALLBACK"
          }
          # Images have no fallback: a floating tag is not something drift can
          # be measured against, so a catalog without an image fails the check.
          API_IMAGE=$(catalog_value '.api_image' "")
          WEB_IMAGE=$(catalog_value '.web_image' "")
          for PAIR in "api=$API_IMAGE" "web=$WEB_IMAGE"; do
            if [ -z "${PAIR#*=}" ]; then
              echo "::error::release catalog has no image for ${PAIR%%=*}; drift cannot be measured against a floating tag"
              exit 1
            fi
          done
          AI_MODE=$(catalog_value '.ai_mode' "saas")
          source "$GITHUB_WORKSPACE/scripts/ci/resolve_byo_ai_config.sh"
          resolve_byo_ai_config "$AI_MODE" "$VAR_AI_ENGINE_DEFAULT" "$VAR_BYO_AI_PROVIDERS"
          AZURE_MCP_ENDPOINT=$(optional_var "$VAR_AZURE_MCP_ENDPOINT")
          AZURE_MCP_TRANSPORT=$(optional_var "$VAR_AZURE_MCP_TRANSPORT")
          AWS_MCP_ENDPOINT=$(optional_var "$VAR_AWS_MCP_ENDPOINT")
          AWS_MCP_TRANSPORT=$(optional_var "$VAR_AWS_MCP_TRANSPORT")
          DRAWIO_MCP_URL=$(optional_var "$VAR_DRAWIO_MCP_URL")
          CUSTOM_DOMAIN_NAME=$(optional_var "$CUSTOM_DOMAIN_NAME")
          CLOUDFRONT_CERTIFICATE_ARN=$(optional_var "$CLOUDFRONT_CERTIFICATE_ARN")

          # The AWS workload takes the platform outputs as variables (Azure looks
          # the network up by name), so read them from the platform state.
          PLATFORM_OUT=$(terraform -chdir=../platform output -json)
          tf_out() { echo "$PLATFORM_OUT" | jq -r --arg k "$1" '.[$k].value // empty'; }
          tf_out_json() { echo "$PLATFORM_OUT" | jq -c --arg k "$1" '.[$k].value // []'; }
          if [ -z "$(tf_out vpc_id)" ]; then
            echo "::error::Platform state has no vpc_id output — has 210 · Deploy run for prod?"
            exit 1
          fi
          OPTIONAL_TERRAFORM_ARGS=()
          if [[ -n "$CLOUDFRONT_CERTIFICATE_ARN" ]]; then
            OPTIONAL_TERRAFORM_ARGS+=("-var=acm_certificate_arn=$CLOUDFRONT_CERTIFICATE_ARN")
          fi

          terraform plan -detailed-exitcode \
            -var="region=$AWS_REGION" \
            -var="region_short=$AWS_REGION_SHORT" \
            -var="tfstate_bucket_name=$TFSTATE_BUCKET" \
            -var="tfstate_lock_table_name=$TFSTATE_LOCK_TABLE" \
            -var="vpc_id=$(tf_out vpc_id)" \
            -var="public_subnet_ids=$(tf_out_json public_subnet_ids)" \
            -var="app_subnet_ids=$(tf_out_json app_subnet_ids)" \
            -var="database_subnet_ids=$(tf_out_json database_subnet_ids)" \
            -var="alb_security_group_id=$(tf_out alb_security_group_id)" \
            -var="app_security_group_id=$(tf_out app_security_group_id)" \
            -var="database_security_group_id=$(tf_out database_security_group_id)" \
            -var="api_image=${API_IMAGE}" \
            -var="web_image=${WEB_IMAGE}" \
            -var="entra_tenant_id=${ENTRA_TENANT_ID}" \
            -var="entra_client_id=${ENTRA_CLIENT_ID}" \
            -var="nextauth_url=${NEXTAUTH_URL}" \
            -var="dockerhub_username=${DOCKERHUB_NAMESPACE}" \
            -var="ai_mode=${AI_MODE}" \
            -var="ai_engine_default=${AI_ENGINE_DEFAULT}" \
            -var="byo_ai_providers=${BYO_AI_PROVIDERS_JSON}" \
            -var="azure_mcp_endpoint=${AZURE_MCP_ENDPOINT}" \
            -var="azure_mcp_transport=${AZURE_MCP_TRANSPORT:-streamable-http}" \
            -var="aws_mcp_endpoint=${AWS_MCP_ENDPOINT}" \
            -var="aws_mcp_transport=${AWS_MCP_TRANSPORT:-streamable-http}" \
            -var="drawio_mcp_url=${DRAWIO_MCP_URL}" \
            -var="github_owner=${GITHUB_OWNER}" \
            -var="github_repository=${GITHUB_REPOSITORY_NAME}" \
            -var="alb_certificate_arn=${ALB_CERTIFICATE_ARN}" \
            -var="custom_domain_name=${CUSTOM_DOMAIN_NAME}" \
            "${OPTIONAL_TERRAFORM_ARGS[@]}" \
            || EXIT=$?
          if [ "${EXIT:-0}" -eq 2 ]; then
            echo "::warning::Drift detected in prod/workload state."
          elif [ "${EXIT:-0}" -ne 0 ]; then
            echo "::error::terraform plan failed for prod/workload (exit $EXIT)."
            exit "$EXIT"
          fi

  # A failing drift check must reach a person (TODO.md T-110): GitHub only
  # e-mails the workflow author on a scheduled-run failure, which for a
  # bot-authored workflow is nobody. One issue per failure kind, deduplicated by
  # exact title, so a month of daily failures is one issue that gets staler and
  # louder — not thirty notifications; every further failure adds a comment.
  report-failure:
    needs: drift-detection
    if: ${{ always() && needs.drift-detection.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      FAILURE_KIND: ${{ needs.drift-detection.outputs.failure_kind }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      OWNER: ${{ github.repository_owner }}
      WORKFLOW_NAME: ${{ github.workflow }}
    steps:
      - name: Open or update the failure issue
        run: |
          if [ "$FAILURE_KIND" = "missing-environment" ]; then
            TITLE="${WORKFLOW_NAME} — the prod environment does not exist"
            SUMMARY="The Terraform state backend or the state for **prod** is missing. The environment has been deleted out of band or was never deployed. This is **not drift**: the way back is a release through \`210 · Deploy\` (after \`000 · Bootstrap Backend\` if the backend itself is gone)."
          else
            TITLE="${WORKFLOW_NAME} — the drift check failed"
            SUMMARY="The drift check did not complete (a \`terraform init\`/\`plan\` error, an expired credential, a provider fault or similar), so drift for **prod** is currently **unknown**. Drift itself is reported as a warning in the run, never here."
          fi
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          # --search is full-text; keep only the exact title.
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)] | .[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Failed again at ${NOW}: ${RUN_URL}"
            echo "Updated issue #${EXISTING}."
            exit 0
          fi
          printf -v BODY '%s\n\n- **Workflow:** %s\n- **First failure seen:** %s\n- **Run:** %s\n\n%s\n' \
            "$SUMMARY" "$WORKFLOW_NAME" "$NOW" "$RUN_URL" \
            "Every further failure of this check adds a comment here until the issue is closed; close it once the check is green again. Do not resolve this by muting the check (\`TODO.md\` → T-110)."
          if ! gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY" --assignee "$OWNER"; then
            # An organization cannot be an assignee: open the issue unassigned rather than not at all.
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
          fi
